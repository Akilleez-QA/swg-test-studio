[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swg-test-studio"
version = "0.2.0"
description = "Local SWG test authoring, existing ELF64 driver execution, and fixture recording"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
swg-tests = "swg_test_studio.cli:main"

[tool.setuptools.package-data]
"*" = ["*.json", "*.cpp", "*.h", "*.java"]

[tool.setuptools.packages.find]
include = ["swg_test_studio*", "devtools", "devtools.*"]
