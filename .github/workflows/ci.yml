name: Studio CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-check:
    name: Studio Docker build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and test Studio
        run: python3 swg-tests.py --workspace "$RUNNER_TEMP/swg-studio" docker-check
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: studio-docker-check
          path: ${{ runner.temp }}/swg-studio/docker-checks/
